<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Jonathan — Portrait in Motion</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="loading">
    <div style="letter-spacing:0.15em; margin-bottom: 8px;">LOADING</div>
    <div id="loading-bar"></div>
  </div>

  <canvas id="c"></canvas>

  <div id="nav-controls">
    <div class="nav-row">
      <button class="zoom-btn" id="zoom-in">+</button>
    </div>
    <div class="nav-row">
      <button class="zoom-btn" id="pan-left">&#8592;</button>
      <span id="zoom-level">1x</span>
      <button class="zoom-btn" id="pan-right">&#8594;</button>
    </div>
    <div class="nav-row">
      <button class="zoom-btn" id="zoom-out">&#8722;</button>
    </div>
  </div>

  <div id="hint">click anywhere to zoom in &nbsp;·&nbsp; drag to pan</div>

  <button id="reset-btn">RESET</button>

  <script src="js/structures.js"></script>
  <script src="js/portrait.js"></script>
  <script src="js/viewport.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
